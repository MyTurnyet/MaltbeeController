[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps = https://github.com/mrrwa/LocoNet.git#1.1.13

[env:native]
platform = native
test_framework = custom
test_build_src = false
build_flags = -std=c++17